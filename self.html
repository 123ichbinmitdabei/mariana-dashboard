<!DOCTYPE html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Check-in</title>
<style>body{font-family:system-ui,Arial,sans-serif;margin:0;background:#eef2ef;color:#22322a;display:flex;min-height:100vh;align-items:center;justify-content:center}.card{background:#fff;border-radius:16px;padding:28px 22px;max-width:360px;width:92%;text-align:center;box-shadow:0 6px 24px rgba(0,0,0,.1)}h1{font-size:20px;margin:0 0 6px}.nm{font-size:22px;font-weight:800;color:#1c8a4e;margin:8px 0 16px}button{font-size:20px;font-weight:700;padding:16px 20px;border:0;border-radius:12px;background:#1c8a4e;color:#fff;width:100%;cursor:pointer}.msg{margin-top:14px;font-size:15px}.ok{color:#1c8a4e;font-weight:700}.sub{color:#6b7c71;font-size:13px;margin-top:10px}</style></head>
<body><div class="card">
<h1>&#127914; Check-in</h1>
<div class="nm" id="nm"></div>
<button id="btn">&#9989; Ich bin da</button>
<div class="msg" id="msg"></div>
<div class="sub">Dein persönlicher Check-in-Link.</div>
</div>
<script>
var U='https://gvzayggvtlychyjbnsgv.supabase.co', K='sb_publishable_W_BRzMC0LFZp8r-WiGTIsg_QZfbZkaf';
var q=new URLSearchParams(location.search); var e=q.get('e')||''; var t=q.get('t')||''; var n=q.get('n')||'';
document.getElementById('nm').textContent = n ? ('Hallo '+n+'!') : '';
var btn=document.getElementById('btn'), msg=document.getElementById('msg');
if(!e||!t){ btn.style.display='none'; msg.textContent='Ung\u00fcltiger Link.'; }
btn.onclick=function(){ btn.disabled=true; msg.textContent='\u2026'; fetch(U+'/rest/v1/self_checkins',{method:'POST',headers:{'apikey':K,'Authorization':'Bearer '+K,'Content-Type':'application/json','Prefer':'resolution=ignore-duplicates'},body:JSON.stringify({event_id:e,token:t})}).then(function(r){ if(r.ok||r.status===409){ msg.innerHTML='<span class="ok">\u2713 Du bist eingecheckt. Willkommen!</span>'; btn.style.display='none'; } else { msg.textContent='Fehler: '+r.status; btn.disabled=false; } }).catch(function(err){ msg.textContent='Netzwerkfehler \u2013 nochmal versuchen.'; btn.disabled=false; }); };
</script></body></html>
