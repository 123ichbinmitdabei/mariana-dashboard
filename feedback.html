<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Feedback</title>
<style>
  :root{--green:#1f7554;--dark:#08160d;--yellow:#f9c74f;--accent:#1c6b3f;--ink:#22322a;--muted:#5f6f65;--line:#dfe7e1;--bg:#eef2ef;}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Segoe UI',Arial,Helvetica,sans-serif;line-height:1.5;}
  .wrap{max-width:560px;margin:0 auto;padding:0 0 40px;}
  .hero{background:var(--dark);color:#fff;padding:26px 24px;border-top:6px solid var(--yellow);}
  .kick{color:var(--yellow);font-size:12px;font-weight:bold;letter-spacing:2px;text-transform:uppercase;}
  .hero h1{margin:8px 0 2px;font-size:23px;line-height:1.2;}
  .body{padding:22px 24px;}
  .card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px;margin:12px 0;}
  label{display:block;font-size:14px;color:var(--muted);margin:12px 0 6px;}
  input,textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:8px;font-size:16px;font-family:inherit;}
  textarea{min-height:96px;resize:vertical;}
  .stars{display:flex;gap:6px;justify-content:center;margin:6px 0 4px;}
  .stars button{background:none;border:0;font-size:40px;line-height:1;cursor:pointer;color:#d8e0da;padding:0;}
  .stars button.on{color:var(--yellow);}
  .send{width:100%;background:var(--green);color:#fff;border:0;border-radius:10px;padding:15px;font-weight:700;font-size:17px;cursor:pointer;margin-top:16px;}
  .send:disabled{background:#b9c8c0;cursor:not-allowed;}
  .msg{font-size:14px;margin-top:10px;min-height:18px;text-align:center;}
  .load,.err{padding:60px 24px;text-align:center;color:var(--muted);font-size:16px;}
  .thanks{text-align:center;padding:40px 24px;}
  .thanks .big{font-size:56px;}
  .thanks h2{color:var(--green);margin:12px 0 6px;}
</style>
</head>
<body>
<div class="wrap"><div id="app"><div class="load">Lade…</div></div></div>
<script>
var CLOUD={url:'https://gvzayggvtlychyjbnsgv.supabase.co',key:'sb_publishable_W_BRzMC0LFZp8r-WiGTIsg_QZfbZkaf'};
var q=new URLSearchParams(location.search); var T=q.get('t')||''; var E=q.get('e')||''; var EID=T+'|'+E;
var TITLE='Veranstaltung'; var rating=0;
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function H(){return {apikey:CLOUD.key,Authorization:'Bearer '+CLOUD.key,'x-team-code':T,'Content-Type':'application/json'};}
async function load(){
  var app=document.getElementById('app');
  if(!T||!E){ app.innerHTML='<div class="err">Ungültiger Link.</div>'; return; }
  try{
    var r=await fetch(CLOUD.url+'/rest/v1/event_dashboard?event_id=eq.'+encodeURIComponent(EID)+'&k=eq.pubinfo&select=v',{headers:H()});
    if(r.ok){ var rows=await r.json(); if(rows.length&&rows[0].v&&rows[0].v.name)TITLE=rows[0].v.name; }
  }catch(e){}
  render();
}
function setStar(n){ rating=n; document.querySelectorAll('.stars button').forEach(function(b,i){ b.className=(i<n)?'on':''; }); }
function render(){
  var app=document.getElementById('app');
  var h='<div class="hero"><div class="kick">CSC Marburg · Dein Feedback</div><h1>'+esc(TITLE)+'</h1></div><div class="body">';
  h+='<div class="card"><label style="text-align:center">Wie hat es dir gefallen?</label><div class="stars">';
  for(var i=1;i<=5;i++){ h+='<button type="button" onclick="setStar('+i+')">★</button>'; }
  h+='</div>';
  h+='<label>Dein Name (optional)</label><input id="fname" placeholder="Vorname" autocomplete="name">';
  h+='<label>Dein Kommentar (optional)</label><textarea id="ftext" placeholder="Was war gut? Was können wir besser machen?"></textarea>';
  h+='<button class="send" onclick="submit()">Feedback absenden</button>';
  h+='<div class="msg" id="msg"></div></div>';
  h+='</div>';
  app.innerHTML=h;
}
function msg(t,err){ var el=document.getElementById('msg'); if(el){ el.textContent=t; el.style.color=err?'#c0504d':'var(--accent)'; } }
async function submit(){
  if(!rating){ msg('Bitte zuerst eine Sternebewertung wählen.',true); return; }
  var nm=(document.getElementById('fname')||{}).value||''; var tx=(document.getElementById('ftext')||{}).value||'';
  msg('Sende…',false);
  var body={event_id:EID, name:(nm.trim()||null), rating:rating, text:(tx.trim()||null)};
  try{
    var r=await fetch(CLOUD.url+'/rest/v1/event_feedback',{method:'POST',headers:Object.assign(H(),{'Prefer':'return=minimal'}),body:JSON.stringify(body)});
    if(r.ok){ thanks(); } else { msg('Konnte nicht senden ('+r.status+'). Bitte nochmal.',true); }
  }catch(e){ msg('Fehler beim Senden. Bitte nochmal.',true); }
}
function thanks(){
  document.getElementById('app').innerHTML='<div class="hero"><div class="kick">CSC Marburg</div><h1>'+esc(TITLE)+'</h1></div><div class="thanks"><div class="big">💚</div><h2>Danke für dein Feedback!</h2><div style="color:var(--muted)">Deine Rückmeldung hilft uns fürs nächste Mal.</div></div>';
}
load();
</script>
</body>
</html>
